name: deploy

on:

  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: Создать venv
        run: python -m venv .venv

      - name: Установка зависимостей
        if: steps.venv.outputs.cache-hit != 'true'
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Тесты
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: Создать venv
        run: python -m venv .venv

      - name: Установка зависимостей
        if: steps.venv.outputs.cache-hit != 'true'
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: .venv/bin/python -m ruff check . --output-format=github

      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh-alicerasp.alwaysdata.net >> ~/.ssh/known_hosts 2>/dev/null

      - name: git pull на сервере и сверка коммита
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          output=$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes alicerasp@ssh-alicerasp.alwaysdata.net \
            "cd ~/commentBot && git pull --ff-only && python -m pip install -r requirements.txt --user && echo REMOTE_SHA=\$(git rev-parse HEAD)")
          echo "$output"
          remote_sha=$(printf '%s\n' "$output" | sed -n 's/^REMOTE_SHA=//p' | tr -d '\r')
          echo "Ожидался:  $EXPECTED_SHA"
          echo "На сервере: $remote_sha"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Коммит на сервере не совпадает с запушенным"
            exit 1
          else
            echo "Коммит на сервере совпадает с запушенным"
          fi

      - name: Рестарт сайта через API
        run: |
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --basic --user "${{ secrets.ALWAYSDATA_API_KEY }} account=alicerasp:" \
            --request POST https://api.alwaysdata.com/v1/site/987318/restart/)
          echo "HTTP $code"
          test "$code" = "204"

      - name: Проверка, что сайт поднялся после рестарта
        run: |
          url="https://alicerasp.alwaysdata.net/tgbot/health"
          for i in $(seq 1 36); do
            code=$(curl --silent --show-error --output /tmp/health --write-out '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && grep -q '"status"' /tmp/health; then
              echo "Сайт отвечает (HTTP 200) с попытки $i"
              cat /tmp/health
              exit 0
            fi
            echo "Попытка $i: HTTP ${code:-нет ответа}, ждём…"
            sleep 5
          done
          echo "::error::Сайт не ответил за отведённое время"
          exit 1
