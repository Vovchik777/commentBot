name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        id: venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements*.txt') }}

      - name: Создать venv
        run: python -m venv .venv

      - name: Установка зависимостей
        if: steps.venv.outputs.cache-hit != 'true'
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Тесты
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

      - name: Ruff lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: .venv/bin/python -m ruff check . --output-format=github

      - name: Ruff format check
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: .venv/bin/python -m ruff format --check .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh-alicerasp.alwaysdata.net >> ~/.ssh/known_hosts 2>/dev/null

      - name: Синхронизация сервера с main и сверка коммита
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # reset --hard, а не pull --ff-only: после force-push в main история
          # переписана, и fast-forward невозможен (git pull падает с кодом 128).
          # Сервер — зеркало main: локальные правки tracked-файлов отбрасываются,
          # untracked-файлы reset не трогает.
          output=$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes alicerasp@ssh-alicerasp.alwaysdata.net \
            "cd ~/commentBot && OLD_SHA=\$(git rev-parse HEAD) && git fetch --prune origin main && git reset --hard origin/main && NEW_SHA=\$(git rev-parse HEAD) && \
             if [ \"\$OLD_SHA\" != \"\$NEW_SHA\" ] && git diff --name-only \"\$OLD_SHA\" \"\$NEW_SHA\" -- requirements.txt | grep -q .; then \
               python -m pip install -r requirements.txt --user; \
             fi && echo REMOTE_SHA=\$NEW_SHA")
          echo "$output"
          remote_sha=$(printf '%s\n' "$output" | sed -n 's/^REMOTE_SHA=//p' | tr -d '\r')
          echo "Ожидался:  $EXPECTED_SHA"
          echo "На сервере: $remote_sha"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Коммит на сервере не совпадает с запушенным"
            exit 1
          else
            echo "Коммит на сервере совпадает с запушенным"
          fi

      - name: Рестарт сайта через API
        run: |
          body=$(mktemp)
          code=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --basic --user "${{ secrets.ALWAYSDATA_API_KEY }} account=alicerasp:" \
            --request POST https://api.alwaysdata.com/v1/site/987318/restart/)
          echo "HTTP $code"
          cat "$body"
          test "$code" = "204"

      - name: Проверка, что сайт поднялся после рестарта
        run: |
          url="https://alicerasp.alwaysdata.net/tgbot/health"
          for i in $(seq 1 90); do
            code=$(curl --silent --show-error --output /tmp/health --write-out '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && grep -q '"status"' /tmp/health; then
              echo "Сайт отвечает (HTTP 200) с попытки $i"
              cat /tmp/health
              exit 0
            fi
            echo "Попытка $i: HTTP ${code:-нет ответа}, ждём…"
            sleep 2
          done
          echo "::error::Сайт не ответил за отведённое время"
          exit 1
